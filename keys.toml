# herdr which-key map
#
# Copy this file to your plugin config dir to customise it:
#   cp keys.toml "$(herdr plugin config-dir pradyb.which-key)/keys.toml"
#
# Each [[key]] entry:
#   seq     keys to press, space separated ("w n"). Specials: space tab enter
#           and ctrl+x style chords.
#   group   makes this key a sub-menu with that name (no action)
#   desc    label shown in the popup
#   run     herdr CLI arguments (herdr is prepended automatically)
#   shell   any shell command instead of `run`
#   prompt  ask for text first; available as {input}
#   default pre-filled text for the prompt
#   pick    choose from "workspace", "tab" or "agent" first; id is {pick}
#   stay    true = keep the menu open after running (hydra style, e.g. resize)
#
# Placeholders: {pane} {tab} {workspace} {cwd} {workspace_label} {tab_label}
#               {input} {pick}

[settings]
title = "herdr"
# Popup size is not set here: edit width/height on the [[panes]] entry
# in the plugin's herdr-plugin.toml.

# ---------------------------------------------------------------- top level
[[key]]
seq = "|"
desc = "split right"
run = "pane split {pane} --direction right --focus"

[[key]]
seq = "-"
desc = "split down"
run = "pane split {pane} --direction down --focus"

[[key]]
seq = "z"
desc = "zoom pane"
run = "pane zoom {pane} --toggle"

[[key]]
seq = "space"
desc = "switch workspace"
pick = "workspace"
run = "workspace focus {pick}"

[[key]]
seq = "a"
desc = "jump to agent"
pick = "agent"
run = "agent focus {pick}"

[[key]]
seq = "R"
desc = "reload herdr config"
run = "server reload-config"

# ---------------------------------------------------------------- workspace
[[key]]
seq = "w"
group = "workspace"

[[key]]
seq = "w n"
desc = "new workspace"
run = "workspace create --cwd {cwd} --focus"

[[key]]
seq = "w N"
desc = "new named workspace"
prompt = "Workspace name"
run = "workspace create --cwd {cwd} --label {input} --focus"

[[key]]
seq = "w s"
desc = "switch workspace"
pick = "workspace"
run = "workspace focus {pick}"

[[key]]
seq = "w r"
desc = "rename workspace"
prompt = "Rename workspace"
default = "{workspace_label}"
run = "workspace rename {workspace} {input}"

[[key]]
seq = "w x"
desc = "close workspace"
run = "workspace close {workspace}"

# ---------------------------------------------------------------- tab
[[key]]
seq = "t"
group = "tab"

[[key]]
seq = "t n"
desc = "new tab"
run = "tab create --workspace {workspace} --cwd {cwd} --focus"

[[key]]
seq = "t N"
desc = "new named tab"
prompt = "Tab name"
run = "tab create --workspace {workspace} --cwd {cwd} --label {input} --focus"

[[key]]
seq = "t s"
desc = "switch tab"
pick = "tab"
run = "tab focus {pick}"

[[key]]
seq = "t r"
desc = "rename tab"
prompt = "Rename tab"
default = "{tab_label}"
run = "tab rename {tab} {input}"

[[key]]
seq = "t x"
desc = "close tab"
run = "tab close {tab}"

# ---------------------------------------------------------------- pane
[[key]]
seq = "p"
group = "pane"

[[key]]
seq = "p v"
desc = "split right"
run = "pane split {pane} --direction right --focus"

[[key]]
seq = "p s"
desc = "split down"
run = "pane split {pane} --direction down --focus"

[[key]]
seq = "p z"
desc = "zoom toggle"
run = "pane zoom {pane} --toggle"

[[key]]
seq = "p r"
desc = "rename pane"
prompt = "Pane name"
run = "pane rename {pane} {input}"

[[key]]
seq = "p x"
desc = "close pane"
run = "pane close {pane}"

[[key]]
seq = "p h"
desc = "focus left"
run = "pane focus --direction left --pane {pane}"

[[key]]
seq = "p j"
desc = "focus down"
run = "pane focus --direction down --pane {pane}"

[[key]]
seq = "p k"
desc = "focus up"
run = "pane focus --direction up --pane {pane}"

[[key]]
seq = "p l"
desc = "focus right"
run = "pane focus --direction right --pane {pane}"

[[key]]
seq = "p H"
desc = "swap left"
run = "pane swap --direction left --pane {pane}"

[[key]]
seq = "p J"
desc = "swap down"
run = "pane swap --direction down --pane {pane}"

[[key]]
seq = "p K"
desc = "swap up"
run = "pane swap --direction up --pane {pane}"

[[key]]
seq = "p L"
desc = "swap right"
run = "pane swap --direction right --pane {pane}"

[[key]]
seq = "p t"
desc = "move pane to new tab"
run = "pane move {pane} --new-tab --focus"

# resize: stays open so you can tap h/j/k/l repeatedly, esc to finish
[[key]]
seq = "p R"
group = "resize (repeat)"

[[key]]
seq = "p R h"
desc = "grow left"
stay = true
run = "pane resize --direction left --amount 0.05 --pane {pane}"

[[key]]
seq = "p R j"
desc = "grow down"
stay = true
run = "pane resize --direction down --amount 0.05 --pane {pane}"

[[key]]
seq = "p R k"
desc = "grow up"
stay = true
run = "pane resize --direction up --amount 0.05 --pane {pane}"

[[key]]
seq = "p R l"
desc = "grow right"
stay = true
run = "pane resize --direction right --amount 0.05 --pane {pane}"

# ---------------------------------------------------------------- git worktree
[[key]]
seq = "g"
group = "worktree"

[[key]]
seq = "g n"
desc = "new worktree (branch)"
prompt = "Branch"
run = "worktree create --workspace {workspace} --branch {input} --focus"
