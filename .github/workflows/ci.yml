name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test (py${{ matrix.python }})
    # 22.04 still ships Python 3.8 in setup-python's manifest.
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.8", "3.x"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Compile
        run: python -m py_compile whichkey.py

      - name: Lint launch script
        run: shellcheck launch.sh

      - name: Run tests
        run: python test_whichkey.py
